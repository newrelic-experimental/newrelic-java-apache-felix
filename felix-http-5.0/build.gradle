
// Build.gradle generated for instrumentation module felix-http

apply plugin: 'java'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

dependencies {
	implementation 'org.apache.felix:org.apache.felix.http.jetty:5.0.0'
	// https://mvnrepository.com/artifact/org.osgi/org.osgi.framework
	compileOnly group: 'org.osgi', name: 'org.osgi.framework', version: '1.10.0'

   // New Relic Java Agent dependencies
   implementation 'com.newrelic.agent.java:newrelic-agent:' + project.findProperty('java.agent.version')
   implementation 'com.newrelic.agent.java:newrelic-api:' + project.findProperty('java.agent.version')
   implementation 'com.newrelic.agent.java:agent-bridge:' + project.findProperty('java.agent.version')
   implementation fileTree(include: ['*.jar'], dir: '../test-lib')
}

jar {
  manifest {
    attributes 'Implementation-Title': 'com.newrelic.instrumentation.labs.felix-http-5.0'
    attributes 'Implementation-Vendor': 'New Relic Labs'
    attributes 'Implementation-Vendor-Id': 'com.newrelic.labs'
    attributes 'Implementation-Version': 1.0
  }
}

verifyInstrumentation {
	passesOnly 'org.apache.felix:org.apache.felix.http.jetty:[5.0.0,)'
	excludeRegex '.*RC[1-9]'
}
